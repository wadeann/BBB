version: 4.0.0
# This file is intended for deterministic enforcement outside the LLM.
# If LLM output conflicts with these permissions, the scheduler/execution layer must reject it.

phases:
  RECOVERY_SYNC:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
  PREOPEN_PRECHECK:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
