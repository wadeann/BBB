  ENTRY_WINDOW_PM:
    new_entry: true
    reduce_position: true
    cancel_order: true
    place_order: true
  LATE_SESSION_MANAGE:
    new_entry: true
    reduce_position: true
    cancel_order: true
    place_order: true
    entry_scope: existing_candidates_only
  CLOSE_AUCTION_FREEZE:
    new_entry: false
    reduce_position: false
