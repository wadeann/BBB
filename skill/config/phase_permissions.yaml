    reduce_position: false
    cancel_order: true
    place_order: false
  OPEN_AUCTION_FREEZE:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
  OPEN_RECONCILE:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
  OPEN_STABILIZE:
    new_entry: false
    reduce_position: true
    cancel_order: true
    place_order: true
    order_scope: reduce_only
  ENTRY_WINDOW_AM:
    new_entry: true
    reduce_position: true
    cancel_order: true
    place_order: true
  MORNING_MONITOR:
    new_entry: true
    reduce_position: true
    cancel_order: true
    place_order: true
  MORNING_CLOSE_PROTECT:
    new_entry: false
    reduce_position: true
    cancel_order: true
    place_order: true
    order_scope: reduce_only
  MIDDAY_REVIEW:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
  PM_PRECHECK:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
  PM_STABILIZE:
    new_entry: false
    reduce_position: true
    cancel_order: true
    place_order: true
