    cancel_order: false
    place_order: false
  NIGHT_EVENT_CHECK:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false

  DAILY_REVIEW:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
    mutate_production_config: false

  AUDIT_FINALIZE:
    new_entry: false
    reduce_position: false
    cancel_order: false
    place_order: false
    mutate_production_config: false
    local_audit_write_only: true
