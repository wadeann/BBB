name: apply-universe-corrections

on:
  push:
    branches:
      - data/apply-v076-universe-corrections

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[applied-universe-corrections]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/apply-v076-universe-corrections
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply evidence-gated corrections
        run: python scripts/apply_security_master_verified_corrections.py --apply
      - name: Refresh Universe-only audit artifacts
        run: python scripts/refresh_universe_audit_only.py
      - name: Run tests
        run: pytest -q
      - name: Commit generated data corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/backtest/security_master.csv \
            security_master_correction_audit.csv \
            official_universe_set_diff_detailed.csv \
            historical_data_provenance_audit.json \
            HISTORICAL_DATA_BUILD_PROGRESS.md \
            latest_research_preflight.json
          if git diff --cached --quiet; then
            echo "No generated correction changes to commit."
          else
            git commit -m "data(universe): apply verified early-delisting corrections [applied-universe-corrections]"
            git push origin HEAD:data/apply-v076-universe-corrections
          fi
