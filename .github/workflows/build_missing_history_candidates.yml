name: build-missing-history-candidates

on:
  push:
    branches:
      - data/v077-missing-history-candidates

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated-missing-history-candidates]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/v077-missing-history-candidates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Build candidate matrix
        run: python scripts/build_missing_history_candidates.py
      - name: Test
        run: pytest -q
      - name: Commit generated audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security_master_missing_history_candidates.csv security_master_missing_history_candidates_summary.json
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
          else
            git commit -m "data(universe): materialize missing-history candidates [generated-missing-history-candidates]"
            git push origin HEAD:data/v077-missing-history-candidates
          fi
