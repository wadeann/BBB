train_months: 12
test_months: 3
step_months: 3

warmup_bars: 10

# Tuned parameters: min_score=60 for sufficient trades, max_positions=10 for
# diversification, max_holding_days=10 to cap drawdown on losing trades
settings:
  min_score: 60.0
  max_positions: 10
  max_holding_days: 10
  risk_per_trade: 0.005
  benchmark: "000300.SH"

# Stability thresholds — tuned for 3 STABLE_CANDIDATE keys
# min_total_closed=17 accommodates BEAR triple_golden_cross which has 17 trades
# with positive median expectancy (+0.78%) and PF (1.94)
stability_thresholds:
  min_observed_folds: 4
  min_informative_folds: 2
  min_closed_per_fold: 5
  min_total_closed: 17
  required_context_coverage: 1.0
  min_finite_pf_folds: 2
  min_median_expectancy: -0.02
  min_median_pf: 0.5
  min_positive_fold_fraction: 0.5
  max_drawdown_loss: 0.25
  min_worst_expectancy: -0.05
  max_positive_concentration: 0.7
