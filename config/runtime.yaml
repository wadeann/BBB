version: 0.7.0
backend: production                 # fake | production; production must be an explicit deployment choice
mode: paper
code_version: runtime-v0.7.0
model_id: external-llm
strategy_version: skill-v5.0.0

# Production MCP endpoints. Credentials are intentionally NOT stored here.
# Set ASHARE_MCP_USERNAME / ASHARE_MCP_PASSWORD in the process environment.
mcp:
  transport: streamable_http
  protocol_version: "2025-06-18"
  client_name: a-share-agent
  client_version: "0.7.0"
  timeout_seconds: 20
  verify_tls: true
  services:
    intel:
      enabled: true
      url: "https://mcp.salahe.us.ci/api/intel/mcp"
      url_env: ASHARE_INTEL_MCP_URL
      auth:
        type: basic
        username_env: ASHARE_MCP_USERNAME
        password_env: ASHARE_MCP_PASSWORD

    risk:
      enabled: true
      url: "https://mcp.salahe.us.ci/api/risk"
      auth:
        type: basic
        username_env: ASHARE_MCP_USERNAME
        password_env: ASHARE_MCP_PASSWORD
    exec:
      enabled: true
      url: "https://mcp.salahe.us.ci/api/exec"
      auth:
        type: basic
        username_env: ASHARE_MCP_USERNAME
        password_env: ASHARE_MCP_PASSWORD
    jin10:
      enabled: false
      url_env: ASHARE_JIN10_MCP_URL
      auth:
        type: bearer
        token_env: ASHARE_JIN10_MCP_TOKEN

# Any OpenAI-compatible /v1/chat/completions endpoint can be used.
# Prefer environment variables. For a private trusted host, direct base_url/api_key/model
# fields are also accepted, but never commit secrets to source control.
llm:
  enabled: true
  provider: openai_compatible
  base_url_env: ASHARE_LLM_BASE_URL
  api_key_env: ASHARE_LLM_API_KEY
  model_env: ASHARE_LLM_MODEL
  chat_completions_path: /v1/chat/completions
  timeout_seconds: 120
  retries: 2
  temperature: 0.0
  max_tokens: 4096
  structured_output: json_schema     # auto | json_schema | json_object | none
  # Historical research uses a separate profile: tolerate slower local reasoning
  # models, but structured output remains strict and reproducible.
  research_overrides:
    timeout_seconds: 180
    retries: 1
    max_tokens: 4096
    temperature: 0.0
    structured_output: json_schema

universe_queries:
  wencai:
    - "A股 非ST 非退市 非停牌 上市超过20个交易日"
  tdx:
    - "非ST 非停牌 上市超过20日 成交活跃"
  generic:
    - "A股 非ST 非退市 非停牌 上市超过20个交易日"
  per_source_limit: 200

review:
  use_llm: false

safety:
  allow_real_execution: false
  require_audit_write_before_side_effect: true
  reject_on_audit_failure: true
  reject_on_schema_failure: true

web:
  dashboard_refresh_seconds: 30
  hot_sector_top_n: 8
  allow_phase_control: false
  expose_order_actions: false
  allow_backtest: true
  sse:
    poll_seconds: 0.75
    heartbeat_seconds: 15

worker:
  state_db: data/audit/worker_state.sqlite
  poll_seconds: 2.0
  lease_ttl_seconds: 30
  phase_policies:
    open_auction_observe: {mode: interval, interval_seconds: 60}
    entry_window_am: {mode: interval, interval_seconds: 600}
    morning_monitor: {mode: interval, interval_seconds: 600}
    entry_window_pm: {mode: interval, interval_seconds: 600}
    late_session_manage: {mode: interval, interval_seconds: 600}

notifications:
  enabled: true
  state_db: data/audit/notification_state.sqlite
  poll_seconds: 1.0
  max_attempts: 5
  backoff_seconds: [2, 10, 30, 120, 300]
  rules:
    min_signal_score: 75
    signal_decisions: [ENTRY_CANDIDATE, EXIT_CANDIDATE, ORDER_PROPOSAL]
    notify_risk_pass: false
  browser:
    enabled: true
    event_types: [SIGNAL_DECISION, RISK_RESULT, ORDER_PROPOSAL, ORDER_REQUEST, EXECUTION_RECEIPT, AUDIT_GAP]
    native_notification: optional
  feishu:
    enabled: false
    webhook_url_env: ASHARE_FEISHU_WEBHOOK_URL
    secret_env: ASHARE_FEISHU_SECRET
    format: interactive
    timeout_seconds: 10
    event_types: [SIGNAL_DECISION, RISK_RESULT, ORDER_PROPOSAL, ORDER_REQUEST, EXECUTION_RECEIPT, AUDIT_GAP]
