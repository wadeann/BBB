# Only complete authenticated generations authorize; loose snapshots are staging only.
# Deployment must supply PolicyLoader's external integrity key and trusted identity.
version: 1
loading:
  directories:
    - "data/policy/live"
  # Generation publication age, evaluated at the decision's as_of (0 disables).
  max_file_age_seconds: 86400
validation:
  # Exact four-key identity is mandatory and cannot be configured away.
  allow_future_effective: false
defaults:
  # Explicit approval is always required; no automatic approver.
  expiry_days: 90
audit:
  enable_snapshots: true
  snapshot_directory: "data/policy/audit"
  # Maximum number of snapshots to keep per policy (0 = keep all)
  max_snapshots_per_policy: 100
  # Whether to include full policy content in snapshots
  include_full_content: true

# ── Pattern Registry Metadata ──────────────────────────────────────────
# Canonical pattern catalog.  The authoritative source is
# ``PatternRegistry`` in ``a_share_agent/strategy/pattern_registry.py``;
# this section mirrors it for external tooling and policy key generation.
patterns:
  # --- trend_breakout ---
  - pattern_id: triple_golden_cross
    pattern_version: "1.0.0"
    family: trend_breakout
    required_features: [ma5, ma10, ma20, vv5, vv10, macd]

  - pattern_id: ma_convergence_breakout
    pattern_version: "1.0.0"
    family: trend_breakout
    required_features: [ma5, ma10, ma20, vv20]

  - pattern_id: high_volume_breakout
    pattern_version: "1.0.0"
    family: trend_breakout
    required_features: [vv20]

  # --- trend_pullback ---
  - pattern_id: ma60_breakout_retest
    pattern_version: "1.0.0"
    family: trend_pullback
    required_features: [ma60, vv20]

  - pattern_id: single_bull_hold
    pattern_version: "1.0.0"
    family: trend_pullback
    required_features: [vv5]

  - pattern_id: ma5_momentum_pullback
    pattern_version: "1.0.0"
    family: trend_pullback
    required_features: [ma5]

  - pattern_id: low_volume_support_bull
    pattern_version: "1.0.0"
